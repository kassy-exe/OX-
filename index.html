<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>○×コンボ</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#101a2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="○×コンボ">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--ok-bg:#c9e8d2;--ok-ink:#134e2a;--ng-bg:#2e2742;--ng-ink:#f0c9d2;--band:#101a2c;--band-ink:#eaf0ff;--dim:#8fa0c0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok-bg:#1f4a33;--ok-ink:#d8f5e2}}
:root[data-theme="dark"]{--ok-bg:#1f4a33;--ok-ink:#d8f5e2}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--ng-bg);color:var(--band-ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#stage{position:fixed;inset:0;display:grid;grid-template-rows:1fr 1fr;opacity:1;transition:opacity .3s ease}
.half{display:flex;align-items:center;justify-content:center;cursor:pointer}
.half.ok{background:var(--ok-bg);color:var(--ok-ink)}
.half.ng{background:var(--ng-bg);color:var(--ng-ink)}
.half svg{width:min(40vw,22vh,180px);height:auto;opacity:.9;pointer-events:none}
#band{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);background:var(--band);color:var(--band-ink);padding:10px 12px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 6px 24px rgba(0,0,0,.35);cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.st{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.lb{font-size:11px;color:var(--dim)}
.st b{font-size:clamp(22px,7vw,32px);font-weight:700;font-variant-numeric:tabular-nums}
.st i{font-style:normal;font-size:11px;color:var(--dim);min-height:13px;font-variant-numeric:tabular-nums}
#hist{margin-top:8px;display:flex;justify-content:center;overflow:hidden;white-space:nowrap;line-height:1.2}
#histIn{flex:none;font-size:20px;letter-spacing:.08em;transform-origin:center}
.o{color:#7ee0a0}.x{color:#ff7a8c}.empty{color:var(--dim);font-size:13px;letter-spacing:0}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
#reset{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;width:54px;height:54px;border-radius:50%;border:1.5px solid currentColor;background:rgba(255,255,255,.25);color:var(--ok-ink);overflow:hidden;padding:0;font:inherit;cursor:pointer;opacity:.7}
#reset .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(255,80,100,.55);transition:height 0s}
#reset.holding .fill{height:100%;transition:height 2s linear}
#reset .tx{position:relative;display:block;font-size:10px;line-height:1.15;font-weight:600}
#reset small{display:block;font-size:9px;font-weight:400}
#fx{position:fixed;inset:-24px;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;z-index:5;text-align:center}
#fx.show{display:flex}
.ring{position:absolute;left:50%;top:50%;width:40vmin;height:40vmin;margin:-20vmin 0 0 -20vmin;border-radius:50%;border:6px solid currentColor;opacity:0;animation:ring .9s ease-out forwards}
.r2{animation-delay:.15s}.r3{animation-delay:.3s}
@keyframes ring{0%{transform:scale(.2);opacity:.9}100%{transform:scale(3);opacity:0}}
#fx.fx-ng .ring{display:none}
.tag{position:relative;font-size:clamp(18px,6vw,28px);font-weight:700;letter-spacing:.2em;min-height:1.2em}
.big{position:relative;font-size:clamp(64px,24vw,140px);font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.sub{position:relative;font-size:clamp(16px,5vw,24px);font-weight:600;min-height:1.3em;margin-top:6px}
#fx.fx-ok{background:radial-gradient(circle at 50% 50%,#f4fdd0 0,#8fdcae 70%);color:#0f3d22}
#fx.fx-crit{background:radial-gradient(circle at 50% 50%,#fff3a0 0,#ffb020 55%,#ff6a00 100%);color:#3b1700;animation:flash .25s ease-out}
#fx.fx-ng{background:#3b0a14;color:#ff98a8;animation:shake .45s linear}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-14px)}30%{transform:translateX(12px)}45%{transform:translateX(-10px)}60%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@keyframes flash{0%{filter:brightness(2.2)}100%{filter:none}}
.sp{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);background:var(--c);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:sp var(--t) ease-out var(--d) forwards}
@keyframes sp{0%{transform:translate(0,0) scale(.2) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(180deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.ring,.sp{display:none}#fx.fx-ng,#fx.fx-crit{animation:none}.big,.pop{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div class="half ok" id="okBtn" role="button" aria-label="正解 ○">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="10"><circle cx="50" cy="50" r="40"/></svg>
  </div>
  <div class="half ng" id="ngBtn" role="button" aria-label="不正解 ×">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"><path d="M14 14L86 86M86 14L14 86"/></svg>
  </div>
  <div id="band">
    <div class="stats">
      <div class="st"><span class="lb">コンボ</span><b id="vCombo">0</b><i id="vMult">×1.00</i></div>
      <div class="st"><span class="lb">スコア</span><b id="vScore">0</b><i></i></div>
      <div class="st"><span class="lb">クリティカル率</span><b id="vCrit">17.5%</b><i>直近20回</i></div>
    </div>
    <div id="hist" aria-label="○×履歴"><span id="histIn"></span></div>
  </div>
  <button id="reset" type="button" aria-label="リセット（2秒長押し）"><span class="fill"></span><span class="tx">リセット<small>長押し</small></span></button>
</div>
<div id="fx"><i class="ring"></i><i class="ring r2"></i><i class="ring r3"></i><div class="tag" id="fxTag"></div><div class="big" id="fxBig"></div><div class="sub" id="fxSub"></div></div>
<script>
(function(){
'use strict';
var KEY='ox-study-v1';
var $=function(id){return document.getElementById(id);};
var stage=$('stage'),fx=$('fx'),fxTag=$('fxTag'),fxBig=$('fxBig'),fxSub=$('fxSub');
var vCombo=$('vCombo'),vMult=$('vMult'),vScore=$('vScore'),vCrit=$('vCrit'),hist=$('hist'),histIn=$('histIn'),rb=$('reset');
var st={score:0,combo:0,hist:[]},locked=false,ac=null,holdT=null;

function load(){
  try{
    var r=localStorage.getItem(KEY); if(!r) return;
    var d=JSON.parse(r);
    if(d&&Number.isInteger(d.score)&&d.score>=0&&Number.isInteger(d.combo)&&d.combo>=0&&typeof d.hist==='string'&&/^[01]*$/.test(d.hist)){
      st={score:d.score,combo:d.combo,hist:d.hist.split('').map(Number)};
    }
  }catch(e){}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({score:st.score,combo:st.combo,hist:st.hist.join('')}));}catch(e){}
}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function mult(c){return Math.min(3,1+c*0.05);}
function critP(){
  var r=st.hist.slice(-20),o=0,i;
  for(i=0;i<r.length;i++) o+=r[i];
  o+=(20-r.length)/2;
  return 0.05+0.25*(o/20);
}
function pop(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function fitHist(){
  histIn.style.transform='none';
  var w=histIn.offsetWidth,a=hist.clientWidth;
  if(a>0&&w>a) histIn.style.transform='scale('+(a/w*0.98)+')';
}
function render(animate){
  vCombo.textContent=st.combo;
  vMult.textContent='×'+mult(st.combo).toFixed(2);
  vScore.textContent=st.score.toLocaleString('ja-JP');
  vCrit.textContent=(critP()*100).toFixed(1)+'%';
  if(st.hist.length){
    histIn.innerHTML=st.hist.map(function(h){return h?'<span class="o">○</span>':'<span class="x">×</span>';}).join('');
  }else{
    histIn.innerHTML='<span class="empty">履歴なし</span>';
  }
  fitHist();
  if(animate){pop(vCombo);pop(vScore);pop(vCrit);}
}

function audio(){
  try{
    if(!ac){var C=window.AudioContext||window.webkitAudioContext; if(C) ac=new C();}
    if(ac&&ac.state==='suspended') ac.resume();
  }catch(e){}
}
function tone(f,t0,d,type,v){
  if(!ac) return;
  var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(v,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(ac.destination);
  o.start(t);o.stop(t+d+0.02);
}
function glide(f1,f2,t0,d,type,v){
  if(!ac) return;
  var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(v,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(ac.destination);
  o.start(t);o.stop(t+d+0.02);
}
function soundOk(){[523.25,659.25,783.99,1046.5,1318.5,1568,2093].forEach(function(f,i){tone(f,i*0.055,0.3,'triangle',0.22);});[2093,2637].forEach(function(f){tone(f,0.42,0.7,'sine',0.18);});tone(3136,0.42,0.6,'sine',0.08);}
function soundCrit(){
  [523.25,659.25,783.99,1046.5,1318.5,1568,2093,2637,3136].forEach(function(f,i){tone(f,i*0.05,0.32,'triangle',0.22);tone(f/2,i*0.05,0.25,'sine',0.08);});
  [2093,2637,3136].forEach(function(f){tone(f,0.52,0.9,'sine',0.17);});
  [1046.5,1318.5,1568].forEach(function(f){tone(f,0.52,0.9,'triangle',0.14);});
}
function soundNg(){
  glide(260,65,0,0.85,'sawtooth',0.16);glide(275.5,68.9,0,0.85,'sawtooth',0.16);
  glide(367,92,0,0.85,'square',0.07);tone(110,0,0.3,'sine',0.3);
}
function clearSp(){var l=fx.querySelectorAll('.sp'),i;for(i=0;i<l.length;i++) l[i].remove();}
function sparkle(n,crit){
  clearSp();
  var cols=crit?['#ffffff','#ffe066','#ffb020','#ff6a00','#ff3d00']:['#ffc400','#ffe066','#ff9f1c','#22a559','#ffffff','#f59e0b'];
  var i,a,d,e;
  for(i=0;i<n;i++){
    a=Math.random()*Math.PI*2;d=20+Math.random()*(crit?38:32);
    e=document.createElement('i');e.className='sp';
    e.style.setProperty('--dx',(Math.cos(a)*d).toFixed(1)+'vmin');
    e.style.setProperty('--dy',(Math.sin(a)*d).toFixed(1)+'vmin');
    e.style.setProperty('--s',rnd(crit?14:10,crit?34:26)+'px');
    e.style.setProperty('--c',cols[rnd(0,cols.length-1)]);
    e.style.setProperty('--d',(Math.random()*0.3).toFixed(2)+'s');
    e.style.setProperty('--t',(0.7+Math.random()*0.5).toFixed(2)+'s');
    fx.appendChild(e);
  }
}
function buzz(p){try{if(navigator.vibrate) navigator.vibrate(p);}catch(e){}}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

async function answer(ok){
  if(locked) return;
  locked=true; audio();
  try{
    var big,tag,sub,cls,dur,snd,vib;
    if(ok){
      var crit=Math.random()<critP();
      var base=crit?rnd(250,500):rnd(30,70);
      var m=mult(st.combo);
      var gain=Math.round(base*m);
      st.score+=gain;st.combo+=1;st.hist.push(1);
      big='+'+gain;tag=crit?'CRITICAL':'正解';
      sub=m>1?'コンボ倍率 ×'+m.toFixed(2):'';
      cls=crit?'fx-crit':'fx-ok';dur=crit?1600:1000;
      snd=crit?soundCrit:soundOk;vib=crit?[30,30,60]:20;
    }else{
      var loss=Math.min(st.score,rnd(30,70)),lost=st.combo;
      st.score-=loss;st.combo=0;st.hist.push(0);
      big=loss>0?'−'+loss:'±0';tag='不正解';
      sub=lost>0?'コンボ '+lost+' が途切れた':'';
      cls='fx-ng';dur=900;snd=soundNg;vib=[60,40,60];
    }
    save();
    stage.style.transitionDuration='.2s';stage.style.opacity='0';
    await sleep(200);
    fxTag.textContent=tag;fxBig.textContent=big;fxSub.textContent=sub;
    fx.className='show '+cls;
    if(cls!=='fx-ng') sparkle(cls==='fx-crit'?64:30,cls==='fx-crit');
    try{snd();}catch(e){}
    buzz(vib);
    await sleep(dur);
    fx.className='';clearSp();
    stage.style.transitionDuration='.3s';stage.style.opacity='1';
    await sleep(300);
    render(true);
  }finally{
    locked=false;
  }
}

function bind(el,ok){
  el.addEventListener('pointerdown',function(e){
    if(e.button>0) return;
    e.preventDefault();
    answer(ok);
  });
}
bind($('okBtn'),true);
bind($('ngBtn'),false);

function holdEnd(){
  if(holdT){clearTimeout(holdT);holdT=null;}
  rb.classList.remove('holding');
}
function doReset(){
  st={score:0,combo:0,hist:[]};
  save();render(true);buzz(40);
}
rb.addEventListener('pointerdown',function(e){
  if(locked||holdT||e.button>0) return;
  e.preventDefault();
  rb.classList.add('holding');
  holdT=setTimeout(function(){holdT=null;rb.classList.remove('holding');if(!locked) doReset();},2000);
});
['pointerup','pointercancel','pointerleave'].forEach(function(n){rb.addEventListener(n,holdEnd);});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('resize',fitHist);

load();
render(false);
})();
</script>
</body>
</html>
